<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --tc-green:#2DB586;--tc-blue:#228CC2;
    --tc-gradient:linear-gradient(90deg,#2DB586 0%,#228CC2 100%);
    --ink:#1a1a18;--ink-soft:#6b6b66;--surface:#fafaf7;--rule:rgba(26,26,24,.1);
  }
  html,body{height:100%}
  body{
    font-family:'Archivo',sans-serif;background:var(--surface);color:var(--ink);
    display:flex;flex-direction:column;min-height:100vh;
  }
  /* ── Header ── */
  header{
    position:fixed;top:0;left:0;right:0;padding:0 60px;height:64px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:0.5px solid var(--rule);background:var(--surface);z-index:10;
  }
  .logo-link{display:flex;align-items:center;text-decoration:none;color:var(--ink)}
  .logo-svg{width:auto;height:44px}
  header a.back{
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    font-family:'JetBrains Mono',monospace;color:var(--ink-soft);text-decoration:none;
    transition:color .2s;
  }
  header a.back:hover{color:var(--ink)}
  /* ── Main ── */
  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:64px 40px;text-align:center;
  }
  .err-num{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:32px;
    display:flex;align-items:center;gap:16px;
  }
  .err-num::before,.err-num::after{content:'';flex:0 0 32px;height:1px;background:var(--rule)}
  h1{
    font-family:'Fraunces',serif;font-size:clamp(48px,8vw,96px);
    font-weight:400;letter-spacing:-.03em;line-height:.95;margin-bottom:24px;
  }
  h1 em{
    font-style:italic;
    background:var(--tc-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p{
    font-size:16px;color:var(--ink-soft);line-height:1.6;max-width:440px;margin-bottom:40px;
  }
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 28px;background:var(--tc-gradient);color:#fff;
    font-family:'Archivo',sans-serif;font-size:11px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;text-decoration:none;
    position:relative;overflow:hidden;transition:opacity .2s;
  }
  .btn:hover{opacity:.85}
  .btn svg{width:14px;height:14px;flex-shrink:0}
  /* ── Decorative lines ── */
  .geo{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.06}
  main{position:relative;z-index:1}
  /* ── Footer ── */
  footer{
    text-align:center;padding:24px;font-size:12px;color:var(--ink-soft);
    border-top:0.5px solid var(--rule);
  }
  @media(max-width:600px){
    header{padding:0 24px}
    main{padding:80px 24px 40px}
  }
</style>
